name: CI

on:
  push:
  pull_request:

jobs:
  page:
    name: Page (JavaScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm test

      - name: Build page
        run: npm run build

      - name: Check built page
        run: npm run check

      - name: Golden cases are up to date
        run: |
          npm run golden
          git diff --exit-code service/tests/golden.json || { echo "::error::service/tests/golden.json is stale. Run npm run golden and commit it."; exit 1; }

      - name: Upload built page
        uses: actions/upload-artifact@v4
        with:
          name: post-desk-page
          path: dist/index.html

  service:
    name: API (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: service/requirements*.txt

      - run: pip install -r requirements-dev.txt

      - name: Tests (including parity with the page)
        run: pytest

  container:
    name: Container
    runs-on: ubuntu-latest
    needs: service
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t post-desk-api:ci service

      - name: Run and smoke test
        run: |
          docker run -d --name api -p 8080:8080 -e POST_DESK_API_KEY=ci-key -e ANTHROPIC_API_KEY=unused post-desk-api:ci
          for i in $(seq 1 30); do curl -sf localhost:8080/health && break; sleep 1; done
          service/smoke_test.sh http://localhost:8080 ci-key

      - name: Container logs
        if: always()
        run: docker logs api || true
